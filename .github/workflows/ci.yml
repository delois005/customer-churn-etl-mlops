name: ETL MLOps CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python files compile
        run: |
          python -m py_compile app.py
          python -m py_compile src/extract.py
          python -m py_compile src/transform.py
          python -m py_compile src/load.py
          python -m py_compile src/train_model.py

      - name: Test Extract Phase
        run: python src/extract.py

      - name: Test Transform Phase
        run: python src/transform.py

      - name: Test Load Phase
        run: python src/load.py

      - name: Train ML Model
        run: python src/train_model.py

      - name: Build Docker image
        run: docker build -t customer-churn-mlops .

      - name: CI pipeline complete
        run: echo "ETL and MLOps CI pipeline completed successfully"
